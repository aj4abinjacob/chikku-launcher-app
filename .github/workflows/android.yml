name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run-instrumentation:
        description: Also run connectedDebugAndroidTest on an API 36 emulator (not a required check)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs; let every push to main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Android SDK platform matching compileSdk 37 (package name verified with `sdkmanager --list`).
  ANDROID_PLATFORM_PACKAGE: "platforms;android-37.0"

jobs:
  build:
    name: Build, unit tests, lint, privacy gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        # Also validates the Gradle wrapper checksum.
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install Android SDK platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_PLATFORM_PACKAGE" "build-tools;36.0.0"

      - name: Build, test and lint
        run: ./gradlew --stacktrace --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g -Pkotlin.compiler.execution.strategy=in-process assembleDebug :core:model:test testDebugUnitTest lintDebug :app:assembleRelease :app:lintRelease

      - name: Reliability result parser regressions
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Privacy and manifest gate
        run: scripts/check-privacy.sh --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g -Pkotlin.compiler.execution.strategy=in-process

      - name: Verify production package and reviewed licence inventory
        run: |
          ./gradlew --no-daemon --no-configuration-cache --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g -Pkotlin.compiler.execution.strategy=in-process -I scripts/release-audit.init.gradle :app:releaseAuditInputs
          python3 scripts/verify-release-apk.py --build-tools "$ANDROID_HOME/build-tools/36.0.0"

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chikku-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
            core/model/build/reports/
            core/model/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  format:
    name: ktlint (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # TODO: make this blocking once the M0 code from all owners has been formatted and has passed
    # ktlint on main. Until then it reports problems without failing the workflow.
    continue-on-error: true
    env:
      KTLINT_VERSION: "1.8.0"
      # SHA-256 of the `ktlint` asset from https://github.com/pinterest/ktlint/releases/tag/1.8.0
      KTLINT_SHA256: a3fd620207d5c40da6ca789b95e7f823c54e854b7fade7f613e91096a3706d75
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Download and verify ktlint
        run: |
          mkdir -p "$RUNNER_TEMP/ktlint"
          curl -sSLf -o "$RUNNER_TEMP/ktlint/ktlint" \
            "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          echo "${KTLINT_SHA256}  $RUNNER_TEMP/ktlint/ktlint" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/ktlint/ktlint"

      - name: Run ktlint
        # Rules and style come from .editorconfig.
        run: '"$RUNNER_TEMP/ktlint/ktlint" "**/*.kt" "**/*.kts" "!**/build/**"'

  instrumentation:
    name: Instrumentation tests (API 36 emulator, optional)
    # Manual only; not a required check. Emulator results are not physical-device evidence.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run-instrumentation }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install Android SDK platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_PLATFORM_PACKAGE"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew --stacktrace --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g -Pkotlin.compiler.execution.strategy=in-process connectedDebugAndroidTest

      - name: Upload instrumentation reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumentation-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
